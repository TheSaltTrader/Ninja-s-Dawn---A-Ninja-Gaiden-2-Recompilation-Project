# Codegen flags. Defaults keep every guest register in the shared PPCContext,
# which makes correctness depend on each callee's prologue/epilogue saving and
# restoring non-volatiles through guest stack memory. Promoting them to
# function-local variables gives each recompiled function its own copies, so a
# callee cannot lose its caller's r14-r31, and lets the recompiler elide the
# __savegprlr/__restgprlr helper calls entirely. This is the configuration
# re:Blue ships.
# setjmp/longjmp. The recompiler has to model these specially: a longjmp must
# transfer control rather than return, and recompiled functions keep their own
# state that a naive translation would not unwind.
#
# 0x83955C50 is _setjmp - it saves f14-f31, r13-r31, LR, CR and the VMX128
# registers into the buffer in r3, then returns 0. It has no .pdata entry of
# its own; it sits inside longjmp's, which is why it has to be named here.
# 0x83955930 is longjmp(buf, value).
#
# Without these, the error path in the resource parsers (sub_83831098 does
# `bl 0x83955c50; cmpwi r3,0; bne <handler>`) returns normally instead of
# unwinding, execution falls through into a copy loop whose bounds check was
# meant to be fatal, and it overruns a 256-byte stack buffer.
setjmp_address = 0x83955C50
longjmp_address = 0x83955930

skip_lr = true
ctr_as_local = true
xer_as_local = true
cr_as_local = true
reserved_as_local = true
non_volatile_as_local = true

# Vector registers that carry values BETWEEN functions and so must live in the
# shared context rather than being per-function locals.
#
# Found by scanning the generated code for functions that USE one of these
# before writing it - a save via stvx does not count, since the matching
# restore puts it back. Exactly five qualify across all 42,504 functions:
#
#   v69, v72  the video codec's inverse-transform kernels take their vperm
#             control vectors here. Reading zeros made both permutes identical,
#             duplicated a row of the 8x8 transpose, and garbled every video.
#   v64, v65  sub_83A2B890 (same codec module).
#   v96       sub_8376EE38 / 8376FA20 / 8376FFB0.
#
# EVERYTHING ELSE IN v64-v127 MUST STAY LOCAL. The recompiler emits no code for
# the __savevmx/__restvmx prologue helpers, so a shared register used as scratch
# is never restored and clobbers its caller. Sharing all of v64-v127 was tried:
# it fixed the video and broke character animation, leaving the player stuck in
# a looping animation at a ledge in Chapter 5.
shared_vector_registers = [64, 65, 69, 72, 96]
