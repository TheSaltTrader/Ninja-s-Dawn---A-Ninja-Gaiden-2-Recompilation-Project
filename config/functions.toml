# Manual function-boundary overrides for default.xex.
#
# The analyzer derives function bounds from .pdata, then fills gaps. MSVC does
# not emit .pdata entries for `this`-adjusting virtual thunks (two instructions,
# no prologue, no unwind data), so thunks that sit in the padding after a real
# function get absorbed into that function's body. A `b` into one then looks
# like a branch into the middle of a function and fails validation.
#
# Each entry below is a verified `addi r3, r3, N; b <method>` pair.

[functions]

# Reached from the thunk block at 0x8375B0F4; absorbed into fn 0x83759F10.
#   0x83759FF8  addi r3, r3, 0x10
#   0x83759FFC  b    0x8375E380
0x83759FF8 = { name = "adjustor_thunk_83759FF8", size = 0x8 }

